name: Bug report
description: Report a problem with CanvaSlide
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form for CanvaSlide bugs. Include enough detail for someone else to reproduce the issue.

        Please write your issue in English.

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: How were you running CanvaSlide?
      options:
        - Desktop app (Tauri build)
        - Browser dev mode (pnpm dev:web)
        - Exported HTML player
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: CanvaSlide version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: false

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe the bug in your own words. Include a short summary, reproduction steps, and what you expected instead.
      placeholder: |
        Short summary:
        Connector detaches from the shape when ...

        What happened?

        How can we reproduce it?
        1. ...
        2. ...
        3. ...

        What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: document
    attributes:
      label: Sample document
      description: If the bug depends on document content, attach a `.canvaslide` (or an exported HTML) that reproduces it. Drag and drop the file here.
    validations:
      required: false
