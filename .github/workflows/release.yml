# Why: a `v*` tag is the release trigger. The version bump in package.json (which tauri.conf.json
# reads its version from) is merged to main like any change, then its merge commit is tagged;
# pushing the tag runs this workflow, which waits for that commit's CI, builds every platform and
# attaches the installers to a *draft* GitHub Release, whose notes the maintainer writes before
# publishing.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Why: only a commit that passed CI on main is released; the tag may be pushed before CI finishes.
  gate:
    name: wait for CI on the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
    steps:
      - name: Wait for a successful CI run on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          latest_run() {
            gh api -X GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
              -f head_sha="$SHA" -f event=push -f branch=main -f per_page=1 \
              --jq '.workflow_runs[0] | select(.) | "\(.status) \(.conclusion) \(.html_url)"'
          }
          run="$(latest_run)"
          for _ in $(seq 20); do
            [ -z "$run" ] || break
            sleep 30
            run="$(latest_run)"
          done
          if [ -z "$run" ]; then
            echo "No CI run from a push to main for $SHA; tag the merge commit of the release PR" >&2
            exit 1
          fi
          read -r status conclusion url <<< "$run"
          while [ "$status" != completed ]; do
            echo "CI is $status: $url"
            sleep 30
            run="$(latest_run)"
            read -r status conclusion url <<< "$run"
          done
          if [ "$conclusion" != success ]; then
            echo "CI on main for $SHA finished with $conclusion: $url" >&2
            exit 1
          fi
          echo "CI passed on main for $SHA: $url"

  # Why: build scripts and dependencies run here, so this job gets no secrets and no write access.
  build:
    name: build · ${{ matrix.name }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
            args: --target universal-apple-darwin
            bundle-dir: src-tauri/target/universal-apple-darwin/release/bundle
            # Why: the notarize job publishes these files as release-macos-latest, never replacing its input.
            artifact: macos-build
          - name: Windows (x64)
            os: windows-latest
            targets: ''
            args: ''
            bundle-dir: src-tauri/target/release/bundle
            artifact: release-windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # Why: rustup installs the toolchain rust-toolchain.toml pins, then this build's targets.
      - name: Install the pinned Rust toolchain
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          rustup toolchain install --no-self-update
          if [ -n "$TARGETS" ]; then
            rustup target add $TARGETS
          fi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag matches package.json
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
      # Why: later jobs hold the signing credentials: notarize for macOS and sign for the updater.
      - run: pnpm tauri build ${{ matrix.args }} --no-sign
        env:
          VITE_CLOUD_SHARE_URL: ${{ vars.VITE_CLOUD_SHARE_URL }}
      - name: Collect the release files
        shell: bash
        env:
          BUNDLE_DIR: ${{ matrix.bundle-dir }}
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir release-assets
          if [ "$RUNNER_OS" = macOS ]; then
            cp "$BUNDLE_DIR/dmg/CanvaSlide_${version}_universal.dmg" release-assets/
            cp "$BUNDLE_DIR/macos/CanvaSlide.app.tar.gz" release-assets/CanvaSlide_universal.app.tar.gz
          else
            cp "$BUNDLE_DIR/nsis/CanvaSlide_${version}_x64-setup.exe" release-assets/
            cp "$BUNDLE_DIR/msi/CanvaSlide_${version}_x64_en-US.msi" release-assets/
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/
          if-no-files-found: error
          overwrite: true

  # Why: opt in only after Apple credentials are ready; a disabled job allocates no macOS runner.
  notarize:
    name: sign and notarize · macOS
    if: ${{ vars.MACOS_NOTARIZE == 'true' }}
    needs: build
    runs-on: macos-latest
    environment: release
    outputs:
      notarized: ${{ steps.notarize.outputs.notarized }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-build
          path: release-assets
      - name: Sign and notarize the app and disk image
        id: notarize
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash config/scripts/notarize-macos-release.sh release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos-latest
          path: release-assets/
          if-no-files-found: error
          overwrite: true

  # Why: the updater key lives only in the `release` environment; this job runs no package scripts.
  sign:
    name: sign updater files
    needs: [build, notarize]
    # Why: skipped notarization must not skip signing, but failed/cancelled prerequisites must stop it.
    if: ${{ !cancelled() && !failure() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download the macOS release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.notarize.result == 'success' && 'release-macos-latest' || 'macos-build' }}
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-windows-latest
          path: release-assets
      - name: Sign the updater files
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for file in release-assets/*.app.tar.gz release-assets/*-setup.exe release-assets/*.msi; do
            node_modules/.bin/tauri signer sign "$file"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-updater-signatures
          path: release-assets/*.sig
          if-no-files-found: error
          overwrite: true

  # Why: the only job that can write to the repository; it runs no build and never sees the key.
  publish:
    name: publish draft release
    needs: [notarize, sign]
    if: ${{ !cancelled() && !failure() && needs.sign.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Download the macOS release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.notarize.result == 'success' && 'release-macos-latest' || 'macos-build' }}
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-windows-latest
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-updater-signatures
          path: release-assets
      # Why: installed apps update from the latest published release, so its key is the one they trust.
      - name: Find the latest published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2> "$RUNNER_TEMP/latest.err")"; then
            echo "$latest" > "$RUNNER_TEMP/latest-release"
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/latest.err"; then
            : > "$RUNNER_TEMP/latest-release"
          else
            cat "$RUNNER_TEMP/latest.err" >&2
            exit 1
          fi
      # Why: latest.json is the in-app updater's feed (see docs/RELEASE.md §7). It is written only
      # when every signature passes with a key installed apps trust: the latest release's, or this
      # release's own when none is published yet or UPDATER_KEY_CHANGE_TAG names this tag. Its notes
      # are added from the Release body when the release is published (release-notes.yml). The macOS
      # entries are marked notarized only when the notarize job signed them, and only those install
      # in the app on macOS.
      - name: Write the updater feed
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          KEY_CHANGE_TAG: ${{ vars.UPDATER_KEY_CHANGE_TAG }}
          MACOS_NOTARIZED: ${{ needs.notarize.outputs.notarized }}
        run: |
          trusted=()
          notarized=()
          if [ "$MACOS_NOTARIZED" = true ]; then
            notarized+=(--notarized CanvaSlide_universal.app.tar.gz)
          fi
          latest="$(cat "$RUNNER_TEMP/latest-release")"
          if [ -n "$latest" ]; then
            git show "$latest:src-tauri/tauri.conf.json" > "$RUNNER_TEMP/latest-tauri.conf.json"
            trusted+=(--trusted-config "$RUNNER_TEMP/latest-tauri.conf.json")
          fi
          if [ -z "$latest" ] || [ "$KEY_CHANGE_TAG" = "$TAG" ]; then
            trusted+=(--trusted-config src-tauri/tauri.conf.json)
          fi
          node config/scripts/updater-feed.mjs release-assets --tag "$TAG" \
            --repository "$REPOSITORY" "${trusted[@]}" "${notarized[@]}" \
            > release-assets/latest.json
      # Why: the draft starts empty so no placeholder can reach the update notice if it is published.
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2> "$RUNNER_TEMP/view.err")"; then
            if [ "$draft" != true ]; then
              echo "Release $TAG is already published; release a new version instead" >&2
              exit 1
            fi
            gh release upload "$TAG" release-assets/* --clobber
          elif grep -qx 'release not found' "$RUNNER_TEMP/view.err"; then
            gh release create "$TAG" release-assets/* --draft --verify-tag \
              --title "CanvaSlide $TAG" --notes ''
          else
            cat "$RUNNER_TEMP/view.err" >&2
            exit 1
          fi
