name: Website

# Why: publish only when CI passed for the same revision that supplies this workflow.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Why: a Pages deployment is never cut off halfway; a queued run replaces an older queued one.
concurrency:
  group: website
  cancel-in-progress: false

jobs:
  # Why: workflow_run uses main's workflow; building an older passing revision can lack its files.
  gate:
    name: CI for the workflow revision
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Check CI for the workflow revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.workflow_sha }}
        run: |
          passed="$(gh api -X GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
            -f head_sha="$SHA" -f branch=main -f event=push -f per_page=1 \
            --jq '.workflow_runs[0] | select(.status == "completed" and .conclusion == "success") | .head_sha')"
          if [ "$passed" != "$SHA" ]; then
            echo "CI has not passed for workflow revision $SHA; leave the current deployment in place"
            exit 0
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  build:
    if: needs.gate.outputs.sha != ''
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: website/dist
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
