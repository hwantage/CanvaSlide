[package]
name = "canvaslide"
version = "0.1.0"
description = "Infinite canvas with presentation frames"
authors = ["hwantage"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "canvaslide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
url = "2"

[dev-dependencies]
url = "2"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
font-kit = "0.14.3"
allsorts = "0.17"
base64 = "0.23.1"
fs2 = "0.4.3"

# Why: only these two launch a second process for a document double-clicked while the app runs;
# macOS delivers it to the running app as `RunEvent::Opened` instead.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
