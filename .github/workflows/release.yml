# Why: a `v*` tag is the release trigger. `pnpm version <bump>` writes package.json (which
# tauri.conf.json reads its version from), commits and tags; pushing the tag runs this workflow,
# which builds every platform and attaches the installers to a *draft* GitHub Release so the
# notes can be reviewed before publishing.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  RELEASE_NOTES: 'See the assets below to download this version and install.'

jobs:
  # Why: build scripts and dependencies run here, so this job gets no secrets and no write access.
  build:
    name: build · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            bundle-dir: src-tauri/target/universal-apple-darwin/release/bundle
          - name: Windows (x64)
            os: windows-latest
            targets: ''
            args: ''
            bundle-dir: src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag matches package.json
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
      # Why: the sign job signs the updater files; no OS code signing is configured yet (#146).
      - run: pnpm tauri build ${{ matrix.args }} --no-sign
        env:
          VITE_CLOUD_SHARE_URL: ${{ vars.VITE_CLOUD_SHARE_URL }}
      - name: Collect the release files
        shell: bash
        env:
          BUNDLE_DIR: ${{ matrix.bundle-dir }}
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir release-assets
          if [ "$RUNNER_OS" = macOS ]; then
            cp "$BUNDLE_DIR/dmg/CanvaSlide_${version}_universal.dmg" release-assets/
            cp "$BUNDLE_DIR/macos/CanvaSlide.app.tar.gz" release-assets/CanvaSlide_universal.app.tar.gz
          else
            cp "$BUNDLE_DIR/nsis/CanvaSlide_${version}_x64-setup.exe" release-assets/
            cp "$BUNDLE_DIR/msi/CanvaSlide_${version}_x64_en-US.msi" release-assets/
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.os }}
          path: release-assets/
          if-no-files-found: error
          overwrite: true

  # Why: the updater key lives only in the `release` environment; this job runs no package scripts.
  sign:
    name: sign updater files
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Sign the updater files
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for file in release-assets/*.app.tar.gz release-assets/*-setup.exe release-assets/*.msi; do
            node_modules/.bin/tauri signer sign "$file"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: updater-signatures
          path: release-assets/*.sig
          if-no-files-found: error
          overwrite: true

  # Why: the only job that can write to the repository; it runs no build and never sees the key.
  publish:
    name: publish draft release
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true
      # Why: latest.json is the in-app updater's feed (see docs/RELEASE.md §7). It is written only
      # when every signature passes with a key installed apps trust: the previous release's, or this
      # release's own when there is none before it or UPDATER_KEY_CHANGE_TAG names this tag.
      - name: Write the updater feed
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          KEY_CHANGE_TAG: ${{ vars.UPDATER_KEY_CHANGE_TAG }}
        run: |
          trusted=()
          if previous="$(git describe --tags --abbrev=0 --match 'v*' "$TAG^")"; then
            git show "$previous:src-tauri/tauri.conf.json" > "$RUNNER_TEMP/previous-tauri.conf.json"
            trusted+=(--trusted-config "$RUNNER_TEMP/previous-tauri.conf.json")
          fi
          if [ ${#trusted[@]} -eq 0 ] || [ "$KEY_CHANGE_TAG" = "$TAG" ]; then
            trusted+=(--trusted-config src-tauri/tauri.conf.json)
          fi
          node config/scripts/updater-feed.mjs release-assets --tag "$TAG" \
            --repository "$REPOSITORY" --notes "$RELEASE_NOTES" "${trusted[@]}" \
            > release-assets/latest.json
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"; then
            if [ "$draft" != true ]; then
              echo "Release $TAG is already published; release a new version instead" >&2
              exit 1
            fi
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --draft --verify-tag \
              --title "CanvaSlide $TAG" --notes "$RELEASE_NOTES"
          fi
