name: Website

# Why: CI builds and tests the site on every change, so whenever CI finishes on main this publishes
# the newest commit of main that passed it, whatever files changed, instead of guessing from paths.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Why: a Pages deployment is never cut off halfway; a queued run replaces an older queued one.
concurrency:
  group: website
  cancel-in-progress: false

jobs:
  # Why: CI runs on main finish out of order or fail, and a queued run can displace another; runs are
  # listed newest first, in merge order, so whichever run starts publishes the newest passing commit.
  gate:
    name: newest main commit with passing CI
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      sha: ${{ steps.newest.outputs.sha }}
    steps:
      - name: Find the commit to publish
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha="$(gh api -X GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f status=success -f per_page=1 \
            --jq '.workflow_runs[0].head_sha // empty')"
          if [ -z "$sha" ]; then
            echo "No CI run from a push to main has passed" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
