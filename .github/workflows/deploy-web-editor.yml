name: Web editor

# Why: the hosted editor serves the share API, so only a commit of main that passed CI may reach it.
# Whenever CI finishes on main, this publishes the newest such commit to Cloudflare Pages production;
# pull request previews stay with the Git integration (docs/CLOUD-SHARE.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Why: a Pages deployment is never cut off halfway; a queued run replaces an older queued one.
concurrency:
  group: web-editor
  cancel-in-progress: false

jobs:
  # Why: CI runs on main finish out of order or fail, and a queued run can displace another; runs are
  # listed newest first, in merge order, so whichever run starts publishes the newest passing commit.
  gate:
    name: newest main commit with passing CI
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      sha: ${{ steps.newest.outputs.sha }}
    steps:
      - name: Find the commit to publish
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha="$(gh api -X GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f status=success -f per_page=1 \
            --jq '.workflow_runs[0].head_sha // empty')"
          if [ -z "$sha" ]; then
            echo "No CI run from a push to main has passed" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # Why: build scripts and dependencies run here, so this job gets no secrets.
  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-editor
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Why: the Cloudflare token lives only in the `web-editor` environment, and the step that receives
  # it runs Wrangler alone: it bundles functions/ and uploads the built files with wrangler.toml.
  deploy:
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: web-editor
      url: https://canvaslide.pages.dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-editor
          path: dist
      # Why: until the maintainer adds the credentials, the Git integration still publishes main.
      - name: Publish to Cloudflare Pages production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning title=Web editor not published::The web-editor environment has no CLOUDFLARE_API_TOKEN secret or CLOUDFLARE_ACCOUNT_ID variable (docs/CLOUD-SHARE.md)"
            exit 0
          fi
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Web editor not published::The web-editor environment is missing $name"
              exit 1
            fi
          done
          node_modules/.bin/wrangler pages deploy --branch main --commit-hash "$SHA"
