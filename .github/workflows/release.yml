# Why: a `v*` tag is the release trigger. `pnpm version <bump>` writes package.json (which
# tauri.conf.json reads its version from), commits and tags; pushing the tag runs this workflow,
# which builds every platform and attaches the installers to a *draft* GitHub Release so the
# notes can be reviewed before publishing.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows (x64)
            os: windows-latest
            targets: ''
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag matches package.json
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match package.json version $version" >&2
            exit 1
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_CLOUD_SHARE_URL: ${{ vars.VITE_CLOUD_SHARE_URL }}
          # Why: signs the updater artifacts; the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CanvaSlide ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          # Why: latest.json is the in-app updater's feed (see docs/RELEASE.md §7).
          includeUpdaterJson: true
          releaseBody: 'See the assets below to download this version and install.'
          args: ${{ matrix.args }}
